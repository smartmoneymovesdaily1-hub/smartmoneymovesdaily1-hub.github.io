<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="A moving box and a clock showing the first 72 hours">
  <rect width="800" height="450" fill="#14532d"/>
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#c9a227" stroke-width="4"/>
  <!-- Moving box -->
  <g>
    <polygon points="300,200 500,200 470,260 330,260" fill="#d9cfa8"/>
    <rect x="330" y="260" width="140" height="120" fill="#f5efdc"/>
    <rect x="395" y="260" width="12" height="120" fill="#c9a227"/>
    <polygon points="300,200 330,260 330,200" fill="#f5efdc"/>
    <polygon points="500,200 470,260 470,200" fill="#e8e0c4"/>
    <rect x="300" y="190" width="200" height="14" fill="#c9a227"/>
  </g>
  <!-- Clock -->
  <g>
    <circle cx="590" cy="150" r="88" fill="#fdfdfd" stroke="#c9a227" stroke-width="8"/>
    <circle cx="590" cy="150" r="8" fill="#14532d"/>
    <line x1="590" y1="150" x2="590" y2="92" stroke="#14532d" stroke-width="8" stroke-linecap="round"/>
    <line x1="590" y1="150" x2="640" y2="168" stroke="#14532d" stroke-width="8" stroke-linecap="round"/>
    <text x="590" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" letter-spacing="2" fill="#c9a227">FIRST 72 HOURS</text>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#c9a227">ONE BOX. ONE PLAN. 72 HOURS.</text>
</svg>
