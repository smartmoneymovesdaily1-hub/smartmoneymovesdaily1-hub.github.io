<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="A medical bill under a magnifying glass">
  <rect width="800" height="450" fill="#14532d"/>
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#c9a227" stroke-width="4"/>
  <!-- Bill document -->
  <g transform="rotate(-3 400 225)">
    <rect x="250" y="55" width="300" height="340" fill="#fdfdfd" stroke="#c9a227" stroke-width="3"/>
    <rect x="250" y="55" width="300" height="58" fill="#c9a227"/>
    <text x="400" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="3" fill="#14532d">MEDICAL BILL</text>
    <rect x="280" y="145" width="240" height="14" fill="#d9d9d9"/>
    <rect x="280" y="180" width="240" height="14" fill="#d9d9d9"/>
    <rect x="280" y="215" width="180" height="14" fill="#d9d9d9"/>
    <rect x="280" y="250" width="240" height="14" fill="#d9d9d9"/>
    <rect x="280" y="285" width="150" height="14" fill="#d9d9d9"/>
    <rect x="280" y="330" width="240" height="6" fill="#c9a227"/>
    <text x="280" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#14532d">TOTAL DUE</text>
    <text x="520" y="365" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#14532d">$ ???</text>
  </g>
  <!-- Magnifying glass -->
  <g>
    <circle cx="585" cy="300" r="92" fill="#c9a227" fill-opacity="0.18" stroke="#c9a227" stroke-width="10"/>
    <line x1="652" y1="368" x2="720" y2="436" stroke="#c9a227" stroke-width="16" stroke-linecap="round"/>
    <text x="585" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#c9a227">?</text>
  </g>
</svg>
