<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="A house with a large gold key">
  <rect width="800" height="450" fill="#14532d"/>
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#c9a227" stroke-width="4"/>
  <!-- House -->
  <g>
    <polygon points="400,80 210,230 250,230 250,370 550,370 550,230 590,230" fill="#f5efdc"/>
    <polygon points="400,80 210,230 590,230" fill="#c9a227"/>
    <rect x="365" y="270" width="70" height="100" fill="#14532d"/>
    <circle cx="418" cy="320" r="6" fill="#c9a227"/>
    <rect x="280" y="255" width="52" height="52" fill="#14532d"/>
    <rect x="468" y="255" width="52" height="52" fill="#14532d"/>
  </g>
  <!-- Key -->
  <g transform="rotate(38 610 300)">
    <circle cx="610" cy="200" r="52" fill="none" stroke="#c9a227" stroke-width="16"/>
    <line x1="610" y1="252" x2="610" y2="400" stroke="#c9a227" stroke-width="16" stroke-linecap="round"/>
    <line x1="610" y1="355" x2="655" y2="355" stroke="#c9a227" stroke-width="14" stroke-linecap="round"/>
    <line x1="610" y1="390" x2="648" y2="390" stroke="#c9a227" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
